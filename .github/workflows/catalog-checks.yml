name: Excel catalog checks and Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: excel-store-pages
  cancel-in-progress: false
jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    outputs:
      deploy: ${{ steps.source.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python build.py --validate
      - run: python -m unittest -v test_catalog
      - name: Build preview safely
        run: |
          python - <<'PY'
          from openpyxl import load_workbook
          w=load_workbook('catalog.xlsx',data_only=True,read_only=True)
          s=dict((str(r[0]),str(r[1])) for r in list(w['Settings'].values)[1:] if r[0] is not None)
          if s.get('demo','1')!='1':raise SystemExit('GitHub Pages is for preview only: set demo to 1')
          PY
          python build.py
      - name: Install browser test dependencies
        run: |
          python -m pip install 'playwright>=1.50,<2'
          python -m playwright install chromium --with-deps
      - name: Browser smoke tests
        run: python test_store_browser.py
      - name: Check Pages publishing source
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type' 2>/dev/null || true)
          if [ "$source" = workflow ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "To enable automatic publishing: Settings > Pages > Source > GitHub Actions." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: storefront-preview
          path: dist/
          retention-days: 3
      - if: steps.source.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/
  deploy:
    if: needs.validate-and-build.outputs.deploy == 'true'
    needs: validate-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Deploy validated storefront
        id: publish
        uses: actions/deploy-pages@v4
